<!--
  ============================================================================
  HARMONIA — Guia interactiva d'harmonia moderna per a guitarra
  ----------------------------------------------------------------------------
  · Un sol fitxer. Cap dependència externa. Funciona offline i al mòbil.
  · Estructura del codi:
        1) CSS (tot dins aquest <style>, per seccions)
        2) DADES        -> notes, formes d'acord, PROGRESSIONS, SONGS
        3) MOTOR        -> transposició, diagrames SVG, àudio (Web Audio)
        4) ESTAT        -> desat local (localStorage amb fallback en memòria)
        5) VISTES        -> una funció render per secció
        6) ROUTER + init
  · Per AMPLIAR: afegeix objectes a l'array SONGS (a dalt de tot del bloc script).
    Cada cançó enllaça amb una progressió pel camp "prog".
  ============================================================================
-->

/* ============================ TOKENS (guia d'estil) ============================ */
:root{
  --ink:#0a0a0c; --panel:#141416; --panel2:#1c1c20; --line:#232327;
  --text:#f2efe9; --muted:#9c9aa1; --muted2:#66646b; --wire:#46454f;
  --amber:#f2b13c; --amber-deep:#c98d24;
  --resolve:#6fce8f; --tension:#e0645f; --sub:#6aa8e0;
  --btn-ink:#181205;
  --amber-rgb:242,177,60;
  --bg1:rgba(242,177,60,.06); --bg2:rgba(106,168,224,.05);
  --radius:12px;
  --shadow:0 6px 24px rgba(0,0,0,.40);
  --mono:'JetBrains Mono',ui-monospace,'SF Mono','Menlo','Consolas',monospace;
  --serif:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif; /* la guia no usa serif: títols en Space Grotesk 700 */
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;
}
:root[data-theme="light"]{
  --ink:#faf8f3; --panel:#ffffff; --panel2:#f1ede4; --line:#e3ded3;
  --text:#191917; --muted:#6b6760; --muted2:#97928a; --wire:#c7bfae;
  --amber:#b06a12; --amber-deep:#8a5210;
  --resolve:#2f8f5b; --tension:#c23f2f; --sub:#2f6fb0;
  --btn-ink:#fff8ee;
  --amber-rgb:176,106,18;
  --bg1:rgba(176,106,18,.05); --bg2:rgba(47,111,176,.05);
  --shadow:0 6px 22px rgba(60,50,30,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 600px at 85% -8%, var(--bg1), transparent 60%),
    radial-gradient(900px 500px at -5% 110%, var(--bg2), transparent 55%),
    var(--ink);
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--amber)}
button,textarea,input,select{font-family:inherit;color:var(--text)}
b,strong{font-weight:600}
h1,h2,h3{font-family:var(--sans);font-weight:700;line-height:1.15;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(1.8rem,4vw,2.1rem)}
h3{font-size:17px;font-weight:600;letter-spacing:0}
h1{font-size:clamp(1.9rem,5vw,3rem)}
h2{font-size:clamp(1.4rem,3.6vw,2rem);margin-bottom:.2em}
h3{font-size:1.15rem;margin-bottom:.15em}
p{margin:.5em 0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.center{text-align:center}

/* ============================ LAYOUT ============================ */
.app{display:flex;min-height:100vh}
/* --- sidebar (desktop) / drawer (mòbil) --- */
#nav{
  width:230px;flex:0 0 230px;background:color-mix(in srgb, var(--panel) 88%, transparent);
  border-right:1px solid var(--line);position:sticky;top:0;height:100vh;
  overflow-y:auto;padding:18px 12px 40px;backdrop-filter:blur(6px);z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px}
.brand .logo{width:34px;height:34px;flex:0 0 34px}
.brand b{font-family:var(--sans);font-weight:700;font-size:1.2rem;letter-spacing:0}
.brand small{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase}
.navsec{color:var(--muted);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;margin:16px 10px 6px}
.navlink{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  background:none;border:0;color:var(--text);font:inherit;font-size:.92rem;
  padding:8px 10px;border-radius:9px;cursor:pointer;transition:background .12s,color .12s
}
.navlink:hover{background:var(--panel2)}
.navlink.active{background:linear-gradient(90deg,rgba(var(--amber-rgb),.16),rgba(var(--amber-rgb),.02));color:var(--text);font-weight:600}
.navlink.active::before{content:"";width:3px;height:16px;background:var(--amber);border-radius:2px;margin-left:-4px;margin-right:4px}
.navlink .ic{width:17px;text-align:center;opacity:.85}

main{flex:1;min-width:0;padding:0}
.wrap{max-width:960px;margin:0 auto;padding:28px 32px 48px}

/* --- top bar (mòbil) --- */
#topbar{
  display:none;position:sticky;top:0;z-index:35;align-items:center;gap:12px;
  padding:10px 14px;background:rgba(20,19,27,.92);border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px)
}
#burger{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  width:40px;height:40px;border-radius:10px;font-size:1.1rem;cursor:pointer}
#topbar b{font-family:var(--serif);font-size:1.05rem}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:38}

/* ============================ COMPONENTS ============================ */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.homeh{font-size:.82rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-family:var(--sans);font-weight:600;margin-bottom:10px}
.homegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.hometile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;color:var(--text);
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 15px;cursor:pointer;
  transition:border-color .15s,transform .15s,background .15s}
.hometile:hover{border-color:var(--amber);transform:translateY(-2px);background:var(--panel2)}
.hometile .hi{font-size:1.35rem;color:var(--amber);line-height:1;margin-bottom:4px}
.hometile .ht{font-family:var(--sans);font-size:1.08rem;font-weight:600;color:var(--text)}
.hometile .hd{font-size:.85rem;color:var(--muted);line-height:1.35}
.grid{display:grid;gap:14px}
.eyebrow{color:var(--amber);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.03em;padding:3px 8px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.warn{color:var(--tension);border-color:rgba(224,100,95,.5);background:rgba(224,100,95,.08)}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;
  padding:11px 18px;border-radius:10px;cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--amber);color:var(--text)}
.btn.primary{background:var(--amber);border:0;color:var(--btn-ink);font-weight:700}
.btn.primary:hover{filter:brightness(1.06)}
.btn.mini{padding:5px 11px;font-size:.82rem;border-radius:8px}
.btn.on{border-color:var(--resolve);color:var(--resolve);background:rgba(111,206,143,.08)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);margin:18px 0;border:0}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  font:inherit;padding:9px 12px;border-radius:10px}
input:focus,select:focus,textarea:focus,.btn:focus,.navlink:focus{outline:2px solid var(--amber);outline-offset:1px}
::placeholder{color:var(--muted2)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted)}

/* --- chord chip (monospace = fa d'acord de cançoner) --- */
.chord{font-family:var(--mono);font-weight:600;font-size:13px;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:5px 10px;display:inline-flex;
  align-items:center;letter-spacing:.02em;white-space:nowrap}
.chord.res{border-color:rgba(111,206,143,.55);color:var(--resolve)}
.chord.ten{border-color:rgba(224,100,95,.5);color:var(--tension)}
.chordrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.arrow{color:var(--muted);font-family:var(--mono)}

/* --- degree pills --- */
.deg{font-family:var(--mono);font-weight:700;padding:4px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line)}
.deg.maj{color:var(--text)}.deg.min{color:var(--muted)}.deg.dom{color:var(--tension)}

/* --- tension meter --- */
.meter{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--resolve),var(--amber),var(--tension))}

/* --- stat --- */
.statn{font-family:var(--serif);font-size:2rem;line-height:1}
.statl{color:var(--muted);font-size:.78rem;letter-spacing:.05em;text-transform:uppercase}
.progressbar{height:10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.progressbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--resolve))}

/* --- table (songs) --- */
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{ text-align:left;color:var(--muted);font-weight:600;font-size:.72rem;letter-spacing:.08em;
  text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr{cursor:pointer}
.tbl tr:hover td{background:var(--panel2)}
.lvl{font-size:.7rem;padding:2px 7px;border-radius:6px;border:1px solid var(--line)}
.lvl1{color:var(--resolve)}.lvl2{color:var(--amber)}.lvl3{color:var(--tension)}

/* --- unlock banner --- */
.unlock{background:linear-gradient(120deg,rgba(var(--amber-rgb),.12),rgba(111,206,143,.10));
  border:1px solid rgba(var(--amber-rgb),.4);border-radius:var(--radius);padding:14px 16px;display:flex;
  gap:12px;align-items:center}
.unlock .big{font-family:var(--serif);font-size:1.8rem;color:var(--amber);line-height:1}

/* --- fretboard svg wrapper --- */
.fret{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}

/* --- circle of fifths --- */
#cofwrap{display:flex;justify-content:center}
.cofseg{cursor:pointer;transition:.12s}
.cofseg:hover{filter:brightness(1.25)}

/* --- quiz --- */
.qopt{display:block;width:100%;text-align:left;margin:6px 0;padding:12px 14px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line);color:var(--text);font:inherit;cursor:pointer}
.qopt:hover{border-color:var(--amber)}
.qopt.good{border-color:var(--resolve);background:rgba(111,206,143,.12)}
.qopt.bad{border-color:var(--tension);background:rgba(224,100,95,.12)}

.hidden{display:none!important}

/* --- sidebar: capçalera de grup (acordió) + col·lapsat --- */
.navsec{display:flex;align-items:center;justify-content:space-between;width:100%;
  background:none;border:0;cursor:pointer;color:var(--muted);font:inherit;
  font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;margin:14px 4px 4px;padding:4px 6px;border-radius:7px}
.navsec:hover{color:var(--text)}
.navsec .chev{font-size:.7rem;transition:transform .15s;opacity:.7}
.navgroup.col .navsec .chev{transform:rotate(-90deg)}
.navgroup.col .navlink{display:none}
.navtop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 4px}
.icobtn{background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;
  width:34px;height:34px;border-radius:9px;font-size:1rem;display:inline-flex;align-items:center;justify-content:center}
.icobtn:hover{background:var(--panel2);color:var(--text)}
/* mode col·lapsat (només icones) */
.app.rail #nav{width:60px;flex-basis:60px;padding:14px 8px 24px}
.app.rail .brand small,.app.rail .brand span b,.app.rail .navtxt,.app.rail .navsec span,.app.rail .navsec .chev,.app.rail .navcollapse-lbl{display:none}
.app.rail .navsec{justify-content:center;margin:12px 0 4px}
.app.rail .navgroup.col .navlink{display:flex}
.app.rail .navlink{justify-content:center;padding:9px 0}
.app.rail .navlink .ic{width:auto}
.app.rail .brand{justify-content:center;padding:6px 0 12px}

/* --- camí de formigues + navegació --- */
.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--muted);text-decoration:none;cursor:pointer}
.crumbs a:hover{color:var(--amber)}
.crumbs .sep{opacity:.5}
.crumbs .here{color:var(--text)}
.navbtns{display:flex;gap:6px;margin-left:auto}
.navbtns button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:.9rem}
.navbtns button:disabled{opacity:.35;cursor:default}
.navbtns button:not(:disabled):hover{border-color:var(--amber)}

/* --- peu de pàgina --- */
.foot{border-top:1px solid var(--line);margin-top:40px;padding:22px 0 10px;
  color:var(--muted);font-size:.82rem;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
.foot a{cursor:pointer}

/* --- solfeig sota els acords --- */.solf{font-family:var(--mono);font-size:.76rem;color:var(--muted);letter-spacing:.02em;margin-top:6px}
.chordgrid{display:flex;gap:6px;align-items:stretch;width:100%}
.chordgrid>.chord.dual{flex:1 1 0;min-width:0;padding:6px 4px}
.chord.dual{flex-direction:column;align-items:center;gap:1px;padding:5px 10px;line-height:1.15}
.chord.dual .cd{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--muted2);letter-spacing:.04em}
.chord.dual.res .cd{color:var(--resolve);opacity:.9}
.chord.dual.ring{border-color:var(--amber);box-shadow:0 0 12px rgba(var(--amber-rgb),.45)}
.chord.dual .ce{font-size:13px;font-weight:600}
.chord.dual .cs{font-size:10px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.chord.dual.res .cs{color:var(--resolve);opacity:.85}
.metdots{display:flex;gap:12px;justify-content:center;align-items:center;min-height:22px}
.metdot{width:16px;height:16px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);transition:transform .06s,background .06s}
.metdot.accent{border-color:var(--amber)}
.metdot.on{background:var(--amber);transform:scale(1.35)}
.metdot.on.accent{background:var(--tension)}
.capopt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem}
/* --- 7 llums dels graus (cantonada superior dreta de la fitxa) --- */
.dethead{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.lamps{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 0;align-self:flex-start}
.lamp{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:56px}
.lamp .bulb{width:26px;height:26px;border-radius:99px;background:var(--panel2);
  border:1px solid var(--wire);transition:background .12s,box-shadow .12s,transform .12s}
.lamp.used .bulb{border-color:var(--amber);background:rgba(var(--amber-rgb),.16)}
.lamp.on .bulb{background:var(--amber);border-color:var(--amber);transform:scale(1.2);
  box-shadow:0 0 16px rgba(var(--amber-rgb),.7)}
.lamp .lname{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--muted2)}
.lamp.used .lname{color:var(--text)}
.lamp .lch{font-family:var(--mono);font-size:11px;color:var(--muted2)}
.lamp.on .lch{color:var(--amber)}
/* --- fila de tonalitat més fàcil --- */
.tbl td.right{text-align:right;white-space:nowrap}
.tag.ok{color:var(--resolve);border-color:rgba(111,206,143,.5);background:rgba(111,206,143,.08)}
.easyrow td{background:rgba(111,206,143,.05)}

/* --- etiqueta de tensió discreta --- */
.tlabel{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.tdot{width:8px;height:8px;border-radius:99px;display:inline-block}

.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============================ RESPONSIVE ============================ */
@media(max-width:820px){
  #nav{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .22s ease;width:270px}
  #nav.open{transform:none}
  #topbar{display:flex}
  #scrim.show{display:block}
  .wrap{padding:18px 15px 60px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</div>
<script>
/* ==========================================================================
   1) MOTOR HARMÒNIC — notes i transposició
   ========================================================================== */
const SHARP=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FLAT =["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"];
// tonalitats que s'escriuen amb bemolls (per triar l'ortografia correcta)
const FLAT_KEYS=new Set(["F","Bb","Eb","Ab","Db","Gb","Dm","Gm","Cm","Fm","Bbm","Ebm"]);
function pcOf(note){ // nota -> classe d'altura 0..11
  const m=note.match(/^([A-G])([#b]?)/); if(!m) return 0;
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]];
  return (base+(m[2]==="#"?1:m[2]==="b"?-1:0)+12)%12;
}
// transposa un acord (inclou baix "/G", sufixos, etc.)
function transposeChord(ch, semis, useFlats){
  if(!ch) return ch;
  return ch.replace(/([A-G][#b]?)/g,(root)=>{
    const pc=(pcOf(root)+semis+120)%12;
    return (useFlats?FLAT:SHARP)[pc];
  });
}
function transposeList(arr,semis,useFlats){return arr.map(c=>transposeChord(c,semis,useFlats));}

/* ---- formes d'acord per als diagrames (mànec) ----
   frets: 6 valors, de corda 6 (Mi greu) a corda 1 (Mi agut).
          -1 = corda muda, 0 = a l'aire, n = trast.  base = trast inicial. */
const SHAPES={
 "C":{f:[-1,3,2,0,1,0]}, "Cmaj7":{f:[-1,3,2,0,0,0]}, "C7":{f:[-1,3,2,3,1,0]},
 "D":{f:[-1,-1,0,2,3,2]}, "Dm":{f:[-1,-1,0,2,3,1]}, "D7":{f:[-1,-1,0,2,1,2]},
 "Dmaj7":{f:[-1,-1,0,2,2,2]}, "Dsus2":{f:[-1,-1,0,2,3,0]}, "Dsus4":{f:[-1,-1,0,2,3,3]},
 "E":{f:[0,2,2,1,0,0]}, "Em":{f:[0,2,2,0,0,0]}, "E7":{f:[0,2,0,1,0,0]}, "Em7":{f:[0,2,0,0,0,0]},
 "F":{f:[1,3,3,2,1,1],base:1}, "Fmaj7":{f:[-1,-1,3,2,1,0]},
 "G":{f:[3,2,0,0,0,3]}, "G7":{f:[3,2,0,0,0,1]}, "Gmaj7":{f:[3,2,0,0,0,2]},
 "A":{f:[-1,0,2,2,2,0]}, "Am":{f:[-1,0,2,2,1,0]}, "A7":{f:[-1,0,2,0,2,0]},
 "Am7":{f:[-1,0,2,0,1,0]}, "Amaj7":{f:[-1,0,2,1,2,0]}, "Asus2":{f:[-1,0,2,2,0,0]}, "Asus4":{f:[-1,0,2,2,3,0]},
 "B":{f:[-1,2,4,4,4,2],base:2}, "Bm":{f:[-1,2,4,4,3,2],base:2}, "B7":{f:[-1,2,1,2,0,2]},
 "Bb":{f:[-1,1,3,3,3,1],base:1}, "Bbm":{f:[-1,1,3,3,2,1],base:1},
 "Dm7":{f:[-1,-1,0,2,1,1],base:1}, "Gm7":{f:[3,5,3,3,3,3],base:3}, "Gm":{f:[3,5,5,3,3,3],base:3},
 "Cm7":{f:[-1,3,5,3,4,3],base:3}, "Fm":{f:[1,3,3,1,1,1],base:1}, "Fm7":{f:[1,3,1,1,1,1],base:1},
 "Bbm7":{f:[-1,1,3,1,2,1],base:1}, "Bb7":{f:[-1,1,3,1,3,1],base:1}, "Eb7":{f:[-1,-1,1,3,2,3],base:1},
 "Ebmaj7":{f:[-1,6,5,3,4,3],base:3}, "Abmaj7":{f:[4,6,5,5,4,4],base:4}, "F#7":{f:[2,4,2,3,2,2],base:2},
 "Dm7b5":{f:[-1,-1,0,1,1,1],base:1}, "Am7b5":{f:[-1,0,1,0,1,-1],base:1},
 "F#m":{f:[2,4,4,2,2,2],base:2}, "C#m":{f:[-1,4,6,6,5,4],base:4}, "C#7":{f:[-1,4,6,4,6,4],base:4}, "Cm":{f:[-1,3,5,5,4,3],base:3}, "F#":{f:[2,4,4,3,2,2],base:2},
 "G#m":{f:[4,6,6,4,4,4],base:4}, "Eb":{f:[-1,-1,1,3,4,3]}, "Ab":{f:[4,6,6,5,4,4],base:4}
};
// intervals per qualitat (per àudio i per generar diagrames aproximats)
const QUAL={ "":[0,4,7], "m":[0,3,7], "7":[0,4,7,10], "maj7":[0,4,7,11], "m7":[0,3,7,10],
  "sus2":[0,2,7], "sus4":[0,5,7], "6":[0,4,7,9], "add9":[0,4,7,14], "9":[0,4,7,10,14],
  "dim":[0,3,6], "aug":[0,4,8], "m6":[0,3,7,9], "m9":[0,3,7,10,14] };
function splitChord(ch){ const m=ch.match(/^([A-G][#b]?)(.*)$/); return m?[m[1],m[2].replace(/\/.*/,"")]:[ch,""]; }
// converteix un acord anglès ("Am","F#m7","Bb") a solfeig català ("Lam","Fa#m7","Sib")
const SOLFEG={C:"Do",D:"Re",E:"Mi",F:"Fa",G:"Sol",A:"La",B:"Si"};
function toSolfege(ch){ const m=ch.match(/^([A-G])([#b]?)(.*)$/); if(!m) return ch;
  return SOLFEG[m[1]]+m[2]+m[3].replace(/^m(?!aj)/,"m"); }
function solfegeLine(chords){ return chords.map(toSolfege).join(" · "); }

/* ---- diagrama SVG d'un acord ---- */
let LEFTY=false;   // diagrames per a guitarra d'esquerrans (s'inicialitza des de store a buildNav)
function chordSVG(ch,size){
  size=size||118;
  const sh=SHAPES[ch];
  const W=size,H=size*1.18,padX=W*0.16,padY=H*0.20,gw=(W-padX*2)/5,fh=(H-padY-H*0.10)/5;
  const xat=i=>padX+(LEFTY?(5-i):i)*gw;   // posició X d'una corda (mirall si esquerrà)
  let s=`<svg viewBox="0 0 ${W} ${H}" class="fret-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Acord ${ch}">`;
  s+=`<rect width="${W}" height="${H}" fill="none"/>`;
  if(!sh){ // sense forma coneguda: mostra el nom en gran
    s+=`<text x="${W/2}" y="${H*0.55}" text-anchor="middle" font-family="var(--mono)" font-size="${W*0.26}" fill="var(--amber)">${ch}</text>`;
    s+=`<text x="${W/2}" y="${H*0.78}" text-anchor="middle" font-size="${W*0.09}" fill="var(--muted)">diagrama no inclòs</text></svg>`;
    return s;
  }
  const base=sh.base||1;
  // trastos horitzontals
  for(let i=0;i<=5;i++){ const y=padY+i*fh;
    s+=`<line x1="${padX}" y1="${y}" x2="${W-padX}" y2="${y}" stroke="var(--wire)" stroke-width="${i===0&&base===1?3.5:1.4}"/>`; }
  // cordes verticals
  for(let i=0;i<6;i++){ const x=padX+i*gw;
    s+=`<line x1="${x}" y1="${padY}" x2="${x}" y2="${padY+fh*5}" stroke="var(--wire)" stroke-width="1.4"/>`; }
  if(base>1) s+=`<text x="${padX-8}" y="${padY+fh*0.72}" text-anchor="end" font-size="${W*0.10}" fill="var(--muted)">${base}</text>`;
  // punts / mudes / a l'aire
  sh.f.forEach((fr,i)=>{ const x=xat(i);
    if(fr===-1){ s+=`<text x="${x}" y="${padY-6}" text-anchor="middle" font-size="${W*0.11}" fill="var(--muted)">×</text>`; }
    else if(fr===0){ s+=`<circle cx="${x}" cy="${padY-9}" r="${W*0.035}" fill="none" stroke="var(--muted)" stroke-width="1.4"/>`; }
    else{ const rel=fr-base+1; const y=padY+(rel-0.5)*fh;
      s+=`<circle cx="${x}" cy="${y}" r="${gw*0.34}" fill="var(--amber)"/>`; }
  });
  s+=`</svg>`; return s;
}

/* ==========================================================================
   ÀUDIO — síntesi simple d'acords amb Web Audio (sense fitxers externs)
   ========================================================================== */
let AC=null; function actx(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function midiFreq(m){ return 440*Math.pow(2,(m-69)/12); }
function chordMidis(ch){
  const [root,suf]=splitChord(ch);
  const iv=QUAL[suf]!==undefined?QUAL[suf]:QUAL[""];
  const base=48+pcOf(root); // al voltant de Do3
  return iv.map(x=>base+x);
}
function pluck(freq,t,dur,gainv){
  const ac=actx(); const o=ac.createOscillator(),g=ac.createGain();
  o.type="triangle"; o.frequency.value=freq;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gainv,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.05);
}
function playChord(ch,when,strum){
  const ac=actx(); if(ac.state==="suspended")ac.resume();
  const t=(when||ac.currentTime); const midis=chordMidis(ch);
  midis.forEach((m,i)=>pluck(midiFreq(m),t+(strum?i*0.045:0),1.1,0.16));
}
function playProgression(chords,bpm){
  const ac=actx(); if(ac.state==="suspended")ac.resume();
  const beat=60/(bpm||88), bar=beat*2; let t=ac.currentTime+0.05;
  chords.forEach(c=>{ playChord(c,t,true); t+=bar; });
  return chords.length*bar*1000;
}
/* Reproductor de progressions pas a pas (permet pausar i reprendre).
   Sona en bucle, marcant l'acord que sona a la targeta. */
let progPl={id:null,i:0,timer:null,chords:[]};
function progMark(){
  document.querySelectorAll(".chord.dual").forEach(el=>el.classList.remove("ring"));
  if(!progPl.id) return;
  const row=document.getElementById("chips-"+progPl.id); if(!row) return;
  const chips=row.querySelectorAll(".chord.dual");
  const cur=chips[(progPl.i-1+progPl.chords.length)%progPl.chords.length];
  if(cur) cur.classList.add("ring");
}
function progPause(){ if(progPl.timer){clearInterval(progPl.timer); progPl.timer=null;} }
function progPlay(pid){
  const p=PROG_BY_ID[pid]; if(!p) return;
  if(progPl.timer&&progPl.id===pid) return;         // ja està sonant
  progPause();
  if(progPl.id!==pid){ progPl={id:pid,i:0,timer:null,chords:realize(p,state.key)}; }
  else progPl.chords=realize(p,state.key);          // continua on estava
  const step=()=>{
    if(progPl.i>=progPl.chords.length) progPl.i=0;  // bucle
    playChord(progPl.chords[progPl.i],null,true); progPl.i++; progMark();
  };
  step(); progPl.timer=setInterval(step,1360);
}

const PROG_BY_ID=Object.fromEntries(PROGRESSIONS.map(p=>[p.id,p]));
function songsOfProg(id){return SONGS.filter(s=>s.prog===id);}
function uniqChords(s){return [...new Set(s.chords)].filter(Boolean);}
/* ==========================================================================
   3) ESTAT + DESAT (localStorage amb fallback en memòria)
   ========================================================================== */
const store=(()=>{ // funciona com a fitxer local; si el navegador bloqueja, memòria
  let mem={}; let ok=true;
  try{const k="__t";localStorage.setItem(k,"1");localStorage.removeItem(k);}catch(e){ok=false;}
  return{
    get(k,d){ try{ if(ok){const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);} }catch(e){}
              return mem[k]!==undefined?mem[k]:d; },
    set(k,v){ try{ if(ok){localStorage.setItem(k,JSON.stringify(v));return;} }catch(e){}
              mem[k]=v; }
  };
})();
const state={
  key:store.get("key","C"),
  learnedProgs:new Set(store.get("lp",[])),
  learnedChords:new Set(store.get("lc",[])),
  learnedSongs:new Set(store.get("ls",[])),
  lyrics:store.get("lyr",{})   // {songId: "lletra afegida per l'usuari"}
};
function save(){ store.set("key",state.key); store.set("lp",[...state.learnedProgs]);
  store.set("lc",[...state.learnedChords]); store.set("ls",[...state.learnedSongs]);
  store.set("lyr",state.lyrics); }

const FLAT_PREF=new Set(["F","Bb","Eb","Ab","Db","Gb"]);
const FLAT_PREF_MIN=new Set(["D","G","C","F","Bb","Eb","Ab"]);   // Rem, Solm, Dom, Fam... porten bemolls
function useFlatsFor(note,minor){ return minor?FLAT_PREF_MIN.has(note):FLAT_PREF.has(note); }
const NOTE_CHOICES=["C","C#","D","Eb","E","F","F#","G","Ab","A","Bb","B"];

/* ---- helpers de render ---- */
function esc(x){return (""+x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function chordChips(chords,{play=true,color=null}={}){
  if(!chords||!chords.length||chords.every(c=>!c)) return `<span class="muted small">—</span>`;
  const chips=chords.map((c,i)=>{
    let cls="chord"; if(color==="tonic"&&i===0)cls+=" res";
    return `<span class="${cls}">${esc(c)}</span>`;
  });
  let html=`<span class="chordrow">`+chips.join(`<span class="arrow">›</span>`);
  if(play) html+=`<button class="btn mini" title="Escolta" onclick='playProgression(${JSON.stringify(chords)},88)'>▶</button>`;
  html+=`</span>`; return html;
}
// acord amb les notacions alineades en columna (grau, anglès i solfeig)
function chordChipsDual(chords,{play=true,color=null,degs=null,id=null}={}){
  if(!chords||!chords.length||chords.every(c=>!c)) return `<span class="muted small">—</span>`;
  const chips=chords.map((c,i)=>{
    let cls="chord dual"; if(color==="tonic"&&i===0)cls+=" res";
    return `<span class="${cls}" data-i="${i}">`
      +(degs?`<span class="cd">${esc(degs[i]||"")}</span>`:"")
      +`<span class="ce">${esc(c)}</span><span class="cs">${esc(toSolfege(c))}</span></span>`;
  });
  let html=`<div class="chordgrid"${id?` id="${id}"`:""}>`+chips.join("");
  if(play) html+=`<button class="btn mini" title="Escolta" onclick='playProgression(${JSON.stringify(chords)},88)'>▶</button>`;
  html+=`</div>`; return html;
}
function degPills(prog){
  return `<span class="chordrow">`+prog.degs.map((d,i)=>{
    const q=prog.quals[i]; const cls=q==="min"?"min":q==="dom"?"dom":"maj";
    return `<span class="deg ${cls}">${esc(d)}</span>`;
  }).join(`<span class="arrow">›</span>`)+`</span>`;
}
function realize(prog,note){ // transposa la progressió a la tònica escollida
  const semis=(pcOf(note)-prog.refPc+120)%12;
  return transposeList(prog.ref,semis,useFlatsFor(note,prog.minor));
}

const MAJ_STEPS=[0,2,4,5,7,9,11], MAJ_Q=["maj","min","min","maj","maj","min","dim"], MAJ_R=["I","ii","iii","IV","V","vi","vii°"];
const MIN_STEPS=[0,2,3,5,7,8,10], MIN_Q=["min","dim","maj","min","min","maj","maj"], MIN_R=["i","ii°","III","iv","v","VI","VII"];
function noteAt(rootNote,semis,minor){ const uf=useFlatsFor(rootNote,minor); return (uf?FLAT:SHARP)[(pcOf(rootNote)+semis)%12]; }
function diatonic(note,minor){
  const steps=minor?MIN_STEPS:MAJ_STEPS, Q=minor?MIN_Q:MAJ_Q, R=minor?MIN_R:MAJ_R;
  return steps.map((st,i)=>{ const n=noteAt(note,st,minor); const q=Q[i];
    const suf=q==="min"?"m":q==="dim"?"dim":""; return {roman:R[i],chord:n+suf,qual:q,note:n}; });
}
function diatonicTable(note,minor){
  const rows=diatonic(note,minor).map(d=>{
    const cls=d.qual==="min"?"min":d.qual==="dim"?"dom":"maj";
    return `<td class="center"><div class="deg ${cls}" style="display:inline-block">${d.roman}</div>
      <div style="margin-top:6px"><span class="chord">${esc(d.chord)}</span></div></td>`;
  }).join("");
  return `<div style="overflow-x:auto"><table class="tbl" style="min-width:520px"><tbody><tr>${rows}</tr></tbody></table></div>`;
}
function keyPicker(cb,current){ // select de tònica reutilitzable
  return `<select onchange="${cb}(this.value)">`+NOTE_CHOICES.map(n=>`<option ${n===current?"selected":""}>${n}</option>`).join("")+`</select>`;
}

function circleSVG(){
  const maj=["C","G","D","A","E","B","F#","Db","Ab","Eb","Bb","F"];
  const min=["Am","Em","Bm","F#m","C#m","G#m","Ebm","Bbm","Fm","Cm","Gm","Dm"];
  const S=300,c=S/2,Rm=125,Ri=82;
  let s=`<svg viewBox="0 0 ${S} ${S}" width="300" style="max-width:100%">`;
  s+=`<circle cx="${c}" cy="${c}" r="148" fill="none" stroke="var(--wire)"/>`;
  s+=`<circle cx="${c}" cy="${c}" r="102" fill="none" stroke="var(--wire)"/>`;
  s+=`<circle cx="${c}" cy="${c}" r="62" fill="none" stroke="var(--wire)"/>`;
  for(let i=0;i<12;i++){ const a=(-90+i*30)*Math.PI/180;
    const active=pcOf(maj[i])===pcOf(state.key);
    const xm=c+Rm*Math.cos(a),ym=c+Rm*Math.sin(a),xi=c+Ri*Math.cos(a),yi=c+Ri*Math.sin(a);
    s+=`<g class="cofseg" onclick="setKey('${maj[i]}')">
      <circle cx="${xm}" cy="${ym}" r="17" fill="${active?"var(--amber)":"var(--panel2)"}" stroke="var(--wire)"/>
      <text x="${xm}" y="${ym+4}" text-anchor="middle" font-family="var(--mono)" font-size="12" fill="${active?"var(--btn-ink)":"var(--text)"}" font-weight="700">${maj[i]}</text></g>`;
    s+=`<text x="${xi}" y="${yi+4}" text-anchor="middle" font-family="var(--mono)" font-size="10" fill="var(--muted)">${min[i]}</text>`;
  }
  s+=`<text x="${c}" y="${c-4}" text-anchor="middle" font-size="11" fill="var(--muted)">tònica</text>`;
  s+=`<text x="${c}" y="${c+14}" text-anchor="middle" font-family="var(--serif)" font-size="18" fill="var(--amber)">${esc(state.key)}</text>`;
  s+=`</svg>`; return s;
}

/* --- il·lustració: 7 llums = els 7 graus de la tonalitat --------------------
   S'encenen en ordre seguint la progressió, sonant l'acord de cada grau.      */
const ROMAN_IX={I:0,II:1,III:2,IV:3,V:4,VI:5,VII:6};
function degIndex(roman){ const r=String(roman).replace(/[^IVXivx]/g,"").toUpperCase(); return ROMAN_IX[r]!==undefined?ROMAN_IX[r]:0; }
let lampT=null, lampPid=null;
function lampsPaint(idx){ const els=document.querySelectorAll("#lamps .lamp");
  els.forEach(el=>el.classList.toggle("on", +el.dataset.i===idx)); }
function lampsStop(){ if(lampT){clearInterval(lampT); lampT=null;} lampPid=null; lampsPaint(-1); }
/* bucle continu i silenciós: només il·lustra l'ordre dels graus */
function lampsLoop(pid){
  const p=PROG_BY_ID[pid]; if(!p) return;
  if(lampT&&lampPid===pid) return;                 // ja està donant voltes
  if(lampT){ clearInterval(lampT); lampT=null; }
  lampPid=pid;
  const seq=p.degs.map(degIndex);
  let i=0;
  const step=()=>{
    if(!document.getElementById("lamps")){ lampsStop(); return; }   // s'ha sortit de la fitxa
    lampsPaint(seq[i%seq.length]); i++;
  };
  step(); lampT=setInterval(step,780);
}
function lampsRow(p){
  const dia=diatonic(state.key,p.minor);            // els 7 graus de la tonalitat actual
  const used=new Set(p.degs.map(degIndex));
  return dia.map((d,i)=>`<div class="lamp${used.has(i)?" used":""}" data-i="${i}">
      <span class="bulb"></span><span class="lname">${esc(d.roman)}</span><span class="lch">${esc(d.chord)}</span>
    </div>`).join("");
}
/* --- quina tonalitat és més còmoda a la guitarra --------------------------- */
const EASY_OPEN=new Set(["C","D","E","G","A","Am","Em","Dm","A7","B7","C7","D7","E7","G7",
  "Cmaj7","Dmaj7","Gmaj7","Am7","Em7","Dsus2","Dsus4","Asus2","Asus4"]);
function keyEase(chords){ return chords.reduce((n,c)=>n+(EASY_OPEN.has(c)?1:0),0); }
function easiestKey(p,keys){
  let best=keys[0], bs=-1;
  keys.forEach(k=>{ const s=keyEase(realize(p,k)); if(s>bs){bs=s;best=k;} });
  return {key:best, score:bs};
}
function progDetail(p){
  setTimeout(()=>lampsLoop(p.id),0);            // les llums van soles, en bucle
  const keys=["C","G","D","A","E","F"], names={C:"Do",G:"Sol",D:"Re",A:"La",E:"Mi",F:"Fa"};
  const easy=easiestKey(p,keys);
  const ex=keys.map(k=>{
    const chs=realize(p,k), isEasy=(k===easy.key), n=chs.length-keyEase(chs);
    return `<tr${isEasy?' class="easyrow"':''}><td><b>${names[k]}${p.minor?" menor":""}</b> <span class="muted small">(${k}${p.minor?"m":""})</span></td>
      <td>${chordChips(chs,{play:true})}</td>
      <td class="right">${isEasy
        ? '<span class="tag ok">✓ la més fàcil</span>'
        : (n>0?`<span class="muted small">${n} amb pestanya</span>`:"")}</td></tr>`;
  }).join("");
  const songs=songsOfProg(p.id);
  const songList=songs.length?songs.map(s=>songRow(s)).join(""):`<tr><td colspan="5" class="muted">Encara no hi ha cançons llistades amb aquesta progressió.</td></tr>`;
  const vids=p.videos.map(v=>`<li>${esc(v)} <span class="muted small">— cerca-ho a YouTube</span></li>`).join("");
  const learned=state.learnedProgs.has(p.id);
  return `<button class="btn mini" onclick="closeProg()">‹ Totes les progressions</button>
    <div class="dethead" style="margin:14px 0 18px">
      <div><div class="eyebrow">Progressió</div><h1>${esc(p.name)}</h1>
        <div style="margin:10px 0">${degPills(p)}</div>
        <button class="btn ${learned?'on':''}" onclick="toggleProg('${p.id}')">${learned?'★ Desada':'☆ Desar'}</button></div>
      <div class="lamps" id="lamps" title="Els graus que fa servir la progressió, en ordre">${lampsRow(p)}</div>
    </div>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <div class="card"><h3>Sensació emocional</h3><p>${esc(p.feel)}</p>
        <div class="small muted" style="margin:10px 0 4px">Nivell de tensió</div><div class="meter"><i style="width:${p.tension}%"></i></div></div>
      <div class="card"><h3>Quan s'utilitza</h3><p class="muted">${esc(p.use)}</p></div>
    </div>
    <div class="card"><h3>Exemples per tonalitat</h3><table class="tbl"><tbody>${ex}</tbody></table>
      <p class="muted small" style="margin-top:10px">Les formes de <b>${esc(easy.key)}</b> són les més còmodes per a aquesta progressió. Per a les altres tonalitats pots fer servir el capo (<a onclick="go('eines')" style="cursor:pointer">Afinador i metrònom → Ajudant de capo</a>).</p></div>
    <div class="card"><h3>Cançons amb aquesta progressió <span class="muted small">(${songs.length})</span></h3>
      <table class="tbl"><thead><tr><th>Cançó</th><th>Artista</th><th>Acords</th><th>Any</th><th>Nivell</th></tr></thead><tbody>${songList}</tbody></table></div>
    <div class="card"><h3>Vídeos suggerits</h3><ul class="muted">${vids}</ul></div>`;
}

let songFilter={q:"",prog:"",style:"",lang:"",level:"",tag:""};
let detailSong=null, detailShift=0;
function setFilter(k,v){songFilter[k]=v;rerender();}
function goToSongs(progId){ songFilter={q:"",prog:progId,style:"",lang:"",level:"",tag:""}; detailSong=null; go("cancons"); }
function openSong(id){detailSong=id;detailShift=0;lyricsEditing=null;rerender();window.scrollTo(0,0);}

function goToSong(id){ detailProg=null; detailSong=id; detailShift=0; lyricsEditing=null;
  if(CURRENT!=="cancons") go("cancons"); else { rerender(); window.scrollTo(0,0); } }
function closeSong(){detailSong=null;lyricsEditing=null;rerender();}
function songRow(s){
  const warn=s.verify?' <span class="tag warn">⚠ per verificar</span>':"";
  const ac=(s.chords&&s.chords.length)?esc(s.chords.join(" "))
    :`<span class="muted">—</span>`;
  return `<tr onclick="goToSong('${s.id}')">
    <td><b>${esc(s.title)}</b>${warn}</td><td class="muted">${esc(s.artist)}</td>
    <td style="font-family:var(--mono);font-size:.82rem;color:var(--amber);white-space:nowrap">${ac}</td>
    <td class="muted">${s.year||"trad."}</td><td>${levelBadge(s.level)}</td></tr>`;
}
function filteredSongs(){
  const q=songFilter.q.toLowerCase();
  return SONGS.filter(s=>{
    if(q&&!(s.title.toLowerCase().includes(q)||s.artist.toLowerCase().includes(q)||s.chords.join(" ").toLowerCase().includes(q)))return false;
    if(songFilter.prog&&s.prog!==songFilter.prog)return false;
    if(songFilter.style&&s.style!==songFilter.style)return false;
    if(songFilter.lang&&s.lang!==songFilter.lang)return false;
    if(songFilter.level&&s.level!=songFilter.level)return false;
    if(songFilter.tag&&!(s.tags||[]).includes(songFilter.tag))return false;
    return true;
  });
}
VIEWS.cancons=function(){
  if(detailSong) return songDetail(SONGS.find(s=>s.id===detailSong));
  const styles=[...new Set(SONGS.map(s=>s.style))].sort();
  const opt=(arr,cur,f,all)=>`<select onchange="setFilter('${f}',this.value)"><option value="">${all}</option>`+
    arr.map(a=>`<option value="${a.v}" ${cur==a.v?"selected":""}>${a.t}</option>`).join("")+`</select>`;
  const rows=filteredSongs();
  const table=rows.length?rows.map(songRow).join(""):`<tr><td colspan="5" class="muted">Cap cançó amb aquests filtres.</td></tr>`;
  return head("Pràctica","Cançons",`Cerca i filtra el repertori. Ara mateix: ${SONGS.length} cançons (${SONGS.filter(s=>!s.verify).length} amb acords confirmats).`)
  +`<div class="card" style="margin-bottom:14px">
      <input placeholder="Cerca per títol, artista o acord…" value="${esc(songFilter.q)}" style="width:100%;margin-bottom:10px"
        oninput="songFilter.q=this.value;renderSongsTable()">
      <div class="row">
        ${opt(PROGRESSIONS.map(p=>({v:p.id,t:p.name+"  ·  "+p.ref.join(" ")})),songFilter.prog,"prog","Tota progressió")}
        ${opt(styles.map(s=>({v:s,t:s})),songFilter.style,"style","Tot estil")}
        ${opt([{v:"en",t:"Anglès"},{v:"es",t:"Castellà"},{v:"ca",t:"Català"},{v:"fr",t:"Francès"}],songFilter.lang,"lang","Tot idioma")}
        ${opt([{v:"1",t:"Principiant"},{v:"2",t:"Intermedi"},{v:"3",t:"Avançat"}],songFilter.level,"level","Tot nivell")}
      </div></div>
    <div class="card"><div id="songtbl"><table class="tbl"><thead><tr><th>Cançó</th><th>Artista</th><th>Acords</th><th>Any</th><th>Nivell</th></tr></thead>
      <tbody>${table}</tbody></table></div></div>`;
};
function renderSongsTable(){ // actualitza només la taula en teclejar (sense perdre focus)
  const rows=filteredSongs();

  if(el) el.innerHTML=`<table class="tbl"><thead><tr><th>Cançó</th><th>Artista</th><th>Acords</th><th>Any</th><th>Nivell</th></tr></thead><tbody>${table}</tbody></table>`;

let lyricsEditing=null;

  const el=document.getElementById("lyrbox"); const val=el?el.value:"";

/* La lletra pot venir de dos llocs:

function fileLyrics(s){ return (s.lyrics||"").trim(); }

      <a class="btn" href="${genius}" target="_blank" rel="noopener">Cerca-la a Genius ↗</a></div></div>`;
}

    ${s.verify?`<div class="unlock" style="border-color:rgba(224,100,95,.5);margin-bottom:12px"><div>⚠ <b>Acords per verificar.</b> Aquesta entrada és del mode temàtic i encara no té els acords confirmats. Afegeix-los tu al camp <code>chords</code>.</div></div>`:""}
    <div class="card">

function rand(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

let exMode=null, exQ=null, exScore={ok:0,total:0};
function exStart(m){exMode=m;exScore={ok:0,total:0};exNew();}
function exNew(){
  const keys=["C","G","D","A","E"];
  if(exMode==="prog"){
    const p=rand(PROGRESSIONS), key=rand(keys);
    const opts=shuffle([p, ...shuffle(PROGRESSIONS.filter(x=>x.id!==p.id)).slice(0,3)]);
    exQ={type:"prog",p,key,chords:realize(p,key),opts,ans:null};
  }else if(exMode==="next"){
    const p=rand(PROGRESSIONS.filter(x=>x.ref.length>=3)), key=rand(keys);
    const ch=realize(p,key), last=ch[ch.length-1], given=ch.slice(0,-1);
    const dia=diatonic(key,false).map(d=>d.chord).filter(c=>c!==last);
    const opts=shuffle([last, ...shuffle(dia).slice(0,3)]);
    exQ={type:"next",p,key,given,last,opts,ans:null};
  }
  rerender();
}
function exAnswer(val){ if(exQ.ans!=null)return; exQ.ans=val; exScore.total++;
  const good=(exQ.type==="prog")?(val===exQ.p.id):(val===exQ.last);
  if(good)exScore.ok++; rerender(); }

/* ==========================================================================
   EINES DE PRÀCTICA — metrònom, afinador de referència, ajudant de capo
   (tot offline amb Web Audio; sense micròfon ni dependències)
   ========================================================================== */
let metBpm=store.get("metbpm",90), metNum=4, metRunning=false, metTimer=null, metBeat=0, metTaps=[];
function metClick(accent){ const ac=actx(); if(ac.state==="suspended")ac.resume();
  const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime;
  o.type="square"; o.frequency.value=accent?1600:1050;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.28,t+0.001);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+0.06); }
function metPaintDots(){ const d=document.getElementById("metdots"); if(!d)return;
  let h=""; for(let i=0;i<metNum;i++) h+=`<span class="metdot${i===metBeat&&metRunning?" on":""}${i===0?" accent":""}"></span>`;
  d.innerHTML=h; }
function metTick(){ metClick(metBeat===0); metPaintDots(); metBeat=(metBeat+1)%metNum; }
function metStart(){ if(metRunning)return; metRunning=true; metBeat=0; metTick();
  metTimer=setInterval(metTick, 60000/metBpm);
  const b=document.getElementById("metbtn"); if(b){b.textContent="Atura"; b.classList.add("on");} }
function metStop(){ metRunning=false; clearInterval(metTimer); metTimer=null; metBeat=0;
  const b=document.getElementById("metbtn"); if(b){b.textContent="Engega"; b.classList.remove("on");} metPaintDots(); }
function metToggle(){ metRunning?metStop():metStart(); }
function metSetBpm(v){ metBpm=Math.max(40,Math.min(240,Math.round(v)||90)); store.set("metbpm",metBpm);
  const l=document.getElementById("metbpm"); if(l)l.textContent=metBpm;
  const s=document.getElementById("metrange"); if(s)s.value=metBpm;
  if(metRunning){ clearInterval(metTimer); metTimer=setInterval(metTick,60000/metBpm); } }
function metTap(){ const now=performance.now(); metTaps.push(now); metTaps=metTaps.filter(t=>now-t<3000);
  if(metTaps.length>=2){ let d=0; for(let i=1;i<metTaps.length;i++)d+=metTaps[i]-metTaps[i-1];
    metSetBpm(60000/(d/(metTaps.length-1))); } }
function metSetNum(n){ metNum=+n; metBeat=0; metPaintDots(); }

const TUNE=[["Mi greu",40],["La",45],["Re",50],["Sol",55],["Si",59],["Mi agut",64]];
function tunePlay(midi){ const ac=actx(); if(ac.state==="suspended")ac.resume();
  const o=ac.createOscillator(), g=ac.createGain(), t=ac.currentTime, f=midiFreq(midi);
  o.type="sine"; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
  g.gain.setValueAtTime(0.22,t+1.4); g.gain.exponentialRampToValueAtTime(0.0001,t+2.0);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+2.05); }

// ajudant de capo: sonar en una tonalitat tocant amb formes obertes fàcils
const EASY_SHAPES=[["C",0],["A",9],["G",7],["E",4],["D",2]];   // tonalitats de formes obertes còmodes
let capoTarget="F";
function capoCalc(v){ if(v!=null)capoTarget=v; const tgt=pcOf(capoTarget);
  const opts=EASY_SHAPES.map(([k,pc])=>({shape:k,capo:((tgt-pc)%12+12)%12}))
    .filter(o=>o.capo<=7).sort((a,b)=>a.capo-b.capo);
  const el=document.getElementById("capores"); if(!el)return;
  el.innerHTML=opts.map(o=>o.capo===0
    ? `<div class="capopt"><b>Sense capo</b> — ja es toca còmode amb formes de <b>${o.shape}</b>.</div>`
    : `<div class="capopt"><b>Capo al trast ${o.capo}</b> → toca amb les formes obertes de <b>${o.shape}</b> (i sonarà en ${esc(capoTarget)}).</div>`
  ).join("");
}

   </div>`
  +`<div class="card"><h3>Ajudant de capo</h3>
     <p class="muted small">Vols que soni en una tonalitat però tocar-la amb acords oberts fàcils? Tria la tonalitat i et diem on posar el capo.</p>
     <div class="row" style="margin:8px 0"><label class="fld">Tonalitat que ha de sonar${keyPicker("capoCalc",capoTarget)}</label></div>
     <div id="capores" class="grid" style="gap:8px"></div>
   </div>`;
};

/* ==========================================================================
   INIT
   ========================================================================== */
buildNav(); rerender();

/* ==========================================================================
   PWA — instal·lació com a app
   Chrome només pot instal·lar quan la pàgina se serveix per http/https
   (amb file:// no ho permet). Per això només ho activem en aquest cas i
   afegim el manifest dinàmicament: així, obert com a fitxer solt, no dona error.
   ========================================================================== */
function showInstallBtn(v){ const b=document.getElementById("installbtn"); if(b) b.classList.toggle("hidden",!v); }
function doInstall(){ const p=window.__installPrompt; if(!p) return; p.prompt();
  p.userChoice.finally(()=>{ window.__installPrompt=null; showInstallBtn(false); }); }
window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); window.__installPrompt=e; showInstallBtn(true); });
window.addEventListener("appinstalled",()=>{ window.__installPrompt=null; showInstallBtn(false); });
if(location.protocol==="http:"||location.protocol==="https:"){
  const l=document.createElement("link"); l.rel="manifest"; l.href="manifest.webmanifest"; document.head.appendChild(l);
  if("serviceWorker" in navigator)
    window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
